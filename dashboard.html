<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>
</head>

<body>

    <div class="dashboard-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h2>Adarsh Online</h2>

            <a href="#">🏠 Dashboard</a>
            <a href="services.html">📋 Services</a>
            <a href="#">👤 Profile</a>

            <button onclick="logout()">
                🚪 Logout
            </button>

        </aside>


        <!-- Main Content -->

        <main class="main-content">

            <h1>Dashboard</h1>

            <p>Welcome to Adarsh Online Solution Admin Panel.</p>


            <!-- Cards -->

            <div class="dashboard-stats">

                <div class="stat-card">
                    <h3>👥</h3>
                    <h2>120</h2>
                    <p>Total Users</p>
                </div>

                <div class="stat-card">
                    <h3>📋</h3>
                    <h2>25</h2>
                    <p>Total Services</p>
                </div>

                <div class="stat-card">
                    <h3>📩</h3>
                    <h2>18</h2>
                    <p>New Enquiries</p>
                </div>

                <div class="stat-card">
                    <h3>💰</h3>
                    <h2>₹25,000</h2>
                    <p>Total Earnings</p>
                </div>

            </div>


            <!-- Recent Enquiries -->

            <div class="recent">

                <h2>Recent Enquiries</h2>

                <div class="enquiry">
                    <strong>Rahul Kumar</strong>
                    <span>PAN Card</span>
                </div>

                <div class="enquiry">
                    <strong>Vikas Singh</strong>
                    <span>Aadhaar Service</span>
                </div>

                <div class="enquiry">
                    <strong>Amit Yadav</strong>
                    <span>Income Certificate</span>
                </div>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
