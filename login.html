<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Adarsh Online Solution</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Welcome Back 👋</h2>

            <p>Login to Adarsh Online Solution</p>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="User ID"
                    required
                >

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        id="showPassword"
                        class="show-btn">
                        👁️
                    </button>

                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <a href="#" class="forgot">
                Forgot Password?
            </a>

            <p id="message"></p>

            <div class="register">
                Don't have an account?
                <a href="register.html">Register</a>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
