<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Submitted | Adarsh Online Solution</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .success-box {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px 25px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,.12);
        }

        .success-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            color: #20a84b;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 12px;
        }

        .application-number {
            margin: 25px 0;
            padding: 18px;
            background: #eef5ff;
            border: 2px dashed #0759d7;
            border-radius: 10px;
        }

        .application-number small {
            display: block;
            color: #555;
            margin-bottom: 7px;
        }

        .application-number strong {
            font-size: 24px;
            color: #0759d7;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 22px;
            background: #0759d7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .whatsapp {
            background: #20a84b;
            margin-left: 8px;
        }

        @media(max-width:600px) {
            .success-box {
                padding: 30px 18px;
            }

            .application-number strong {
                font-size: 19px;
            }

            .whatsapp {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="success-icon">
        ✅
    </div>

    <h1>Application Submitted!</h1>

    <p>
        आपका Scholarship Application सफलतापूर्वक जमा हो गया है।
    </p>

    <div class="application-number">

        <small>
            आपका Application Number
        </small>

        <strong>
            {{ application.application_number }}
        </strong>

    </div>

    <p>
        इस Application Number को सुरक्षित रखें।
        भविष्य में Status देखने के लिए इसकी आवश्यकता होगी।
    </p>

    <a href="/" class="btn">
        🏠 Home Page
    </a>

    <a
        href="https://wa.me/919369270106"
        target="_blank"
        class="btn whatsapp">
        💬 WhatsApp
    </a>

</div>

</body>
</html>
