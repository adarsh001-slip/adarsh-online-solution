<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scholarship Application | Adarsh Online Solution</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: linear-gradient(135deg, #0066ff, #00c6ff);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.10);
        }

        .form-box h2 {
            color: #0759d7;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 15px;
            background: #ff5a00;
            color: white;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #e64f00;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0759d7;
            font-weight: bold;
            text-decoration: none;
        }

        @media(max-width:600px) {
            .form-box {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🎓 Scholarship Application</h1>
    <p>Adarsh Online Solution</p>
</div>

<div class="container">

    <div class="form-box">

        <h2>Student Application Form</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Student Name *</label>
                <input
                    type="text"
                    name="student_name"
                    required>
            </div>

            <div class="form-group">
                <label>Father's Name *</label>
                <input
                    type="text"
                    name="father_name"
                    required>
            </div>

            <div class="form-group">
                <label>Mother's Name</label>
                <input
                    type="text"
                    name="mother_name">
            </div>

            <div class="form-group">
                <label>Mobile Number *</label>
                <input
                    type="tel"
                    name="mobile"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email">
            </div>

            <div class="form-group">
                <label>Date of Birth *</label>
                <input
                    type="date"
                    name="date_of_birth"
                    required>
            </div>

            <div class="form-group">
                <label>Category *</label>

                <select name="category" required>
                    <option value="">Select Category</option>
                    <option value="General">General</option>
                    <option value="OBC">OBC</option>
                    <option value="SC">SC</option>
                    <option value="ST">ST</option>
                    <option value="EWS">EWS</option>
                </select>
            </div>

            <div class="form-group">
                <label>Course / Class *</label>
                <input
                    type="text"
                    name="course_class"
                    placeholder="Example: B.Sc / Class 12"
                    required>
            </div>

            <div class="form-group">
                <label>School / College *</label>
                <input
                    type="text"
                    name="school_college"
                    required>
            </div>

            <div class="form-group">
                <label>University / Board</label>
                <input
                    type="text"
                    name="university_board">
            </div>

            <div class="form-group">
                <label>District *</label>
                <input
                    type="text"
                    name="district"
                    value="Gorakhpur"
                    required>
            </div>

            <div class="form-group">
                <label>State *</label>
                <input
                    type="text"
                    name="state"
                    value="Uttar Pradesh"
                    required>
            </div>

            <div class="form-group">
                <label>Full Address *</label>
                <textarea
                    name="address"
                    required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                📤 Submit Scholarship Application
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
